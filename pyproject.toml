[project]
name = "ship-from"
version = "0.1.0"
description = "The nearest plant is not the cheapest one to ship from."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13.7", "pandas>=2.2", "numpy>=1.26", "scipy>=1.12"]

[project.scripts]
ship-from = "ship_from.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ship_from"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
