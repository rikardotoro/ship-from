<text x="24.0" y="400.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">The rule fills the nearest site with its biggest customer first; the small ones left over sail from wherever still has room.</text>
<text x="24.0" y="418.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Some lanes get dearer on purpose: a tonne moved off a full site frees room for a tonne that saves more.</text>
